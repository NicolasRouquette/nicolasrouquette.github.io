name: Refresh publications

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_publications.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/sources
          git diff --cached --quiet && echo "changed=0" >> "$GITHUB_OUTPUT" && exit 0
          git commit -m "data: refresh publications from OpenAlex/ORCID/Crossref/DBLP/NTRS"
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
        id: commit
      # A GITHUB_TOKEN push does not trigger deploy.yml, so republish gh-pages here.
      - if: steps.commit.outputs.changed == '1'
        run: python scripts/build.py && PAGES_PUSH=1 ./scripts/publish-pages.sh
