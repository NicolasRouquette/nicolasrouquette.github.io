name: Refresh publications and GitHub activity

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run scripts/fetch_publications.py
      - run: uv run scripts/fetch_github.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/activity data/sources
          git diff --cached --quiet && echo "changed=0" >> "$GITHUB_OUTPUT" && exit 0
          git commit -m "data: refresh publications and GitHub activity"
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
        id: commit
      # A GITHUB_TOKEN push does not trigger deploy.yml, so republish gh-pages here.
      - if: steps.commit.outputs.changed == '1'
        run: uv run scripts/build.py --variant auto && PAGES_PUSH=1 ./scripts/publish-pages.sh
